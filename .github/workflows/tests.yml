name: tests
on:
  workflow_dispatch:
  push:
    paths: ["gm_bot/**", "tests/**", "bot.py", "requirements*.txt"]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          repository: belugachel-web/coments-data
          token: ${{ secrets.DATA_SECRET_TOKEN }}
          path: data
      - run: rsync -a --exclude=.git data/ ./
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
