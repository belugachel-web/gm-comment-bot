name: ⚙️ СЛУЖБОВЕ (не чіпати без потреби)
# назва запуску: кліки по чернетках = click (кнопка «Стоп» їх не чіпає), усе інше = run
run-name: ${{ contains(inputs.tg_event, '"type":"callback"') && 'click' || 'run' }}
on:
  workflow_dispatch:
    inputs:
      report:
        description: "ЗВІТ: скільки коментарів без відповіді і де. Нічого не публікує"
        type: boolean
        default: false
      age:
        description: "ВІК коментарів для звіту/перегляду (в днях)"
        type: choice
        options: [як у налаштуваннях (30), усі, "7", "30", "365"]
        default: як у налаштуваннях (30)
      stress:
        description: "ТЕСТ: вигадані коментарі нард через Gemini + контролер, підсумок у Telegram. Витрачає ключі Gemini (30 — дешево, 130 — повний). Нічого не публікує"
        type: choice
        options: [ні, "30", "130"]
        default: ні
      source:
        description: "ДЖЕРЕЛО: facebook = справжні коментарі; mock = вигадані (перевірка без Facebook, покаже 10 відповідей у Telegram)"
        type: choice
        options: [facebook, mock]
        default: facebook
      tg_event:
        description: "НЕ ЗАПОВНЮВАТИ. Сюди Telegram сам передає кнопки ✅/❌ і меню запуску"
        default: ""
permissions:
  contents: write
  actions: write
# кліки кнопок: одна група на одне повідомлення (подвійний тап по тій самій чернетці стає в чергу і бачить «вже відповіли»), різні чернетки — паралельно; решта — в одній черзі `bot`
concurrency:
  group: ${{ contains(inputs.tg_event, '"type":"callback"') && format('click-{0}', fromJSON(inputs.tg_event || '{}').message_id || github.run_id) || 'bot' }}
  cancel-in-progress: false
jobs:
  run:
    uses: ./.github/workflows/_run.yml
    secrets: inherit
    with:
      page: ${{ fromJSON(inputs.tg_event || '{}').page || '' }}
      mode: ${{ fromJSON(inputs.tg_event || '{}').mode || '' }}
      preview: ${{ fromJSON(inputs.tg_event || '{}').preview || (inputs.source == 'mock' && '10') || '' }}
      report: ${{ (inputs.report && '1') || fromJSON(inputs.tg_event || '{}').report || '' }}
      stress: ${{ ((inputs.stress == '30' || inputs.stress == '130') && inputs.stress) || fromJSON(inputs.tg_event || '{}').stress || '' }}
      source: ${{ (inputs.source == 'mock' && 'mock') || fromJSON(inputs.tg_event || '{}').source || '' }}
      old: ${{ fromJSON(inputs.tg_event || '{}').old || '' }}
      age: ${{ fromJSON(inputs.tg_event || '{}').age || (inputs.age == 'усі' && 'all') || ((inputs.age == '7' || inputs.age == '30' || inputs.age == '365') && inputs.age) || '' }}
      limit: ${{ fromJSON(inputs.tg_event || '{}').limit || '' }}
